version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

  api1:
    build:
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
    restart: always

  worker:
    build:
    command: ["node", "src/workers/submissionWorker.js"]
    volumes:
      #mount Docker socker so worker can spawn ephemeral sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MONGO_URI=${MONGO_URI}
      -REDIS_URL=${REDIS_URL}
    restart: always